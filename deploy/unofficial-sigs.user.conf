# NoiseFence overrides for clamav-unofficial-sigs 8.0.0.
# Start with Sanesecurity LOW signatures, which remain advisory in NoiseFence.
user_configuration_complete="yes"
default_dbs_rating="LOW"
sanesecurity_dbs_rating="LOW"
sanesecurity_enabled="yes"
additional_enabled="no"
ditekshen_enabled="no"
interserver_enabled="no"
linuxmalwaredetect_enabled="no"
malwareexpert_enabled="no"
malwarepatrol_enabled="no"
securiteinfo_enabled="no"
twinclams_enabled="no"
urlhaus_enabled="no"
yararulesproject_enabled="no"
enable_yararules="no"
allow_upgrades="no"
allow_update_checks="no"
enable_gpg="yes"
downloader_ignore_ssl_errors="no"
clam_dbs="/var/lib/noisefence-signatures"
clamd_socket="/run/noisefence-signatures/clamd.ctl"
clamd_pid="/run/noisefence-signatures/clamd.pid"
reload_dbs="yes"
clamd_reload_opt="clamdscan --config-file=/etc/clamav/noisefence-signatures.conf --reload"
clamd_restart_opt=""
# The timer supplies jitter; never run an additional cron job for this updater.
enable_random="no"
downloader_connect_timeout="20"
downloader_max_time="180"
downloader_tries="2"
rsync_connect_timeout="20"
rsync_max_time="120"
