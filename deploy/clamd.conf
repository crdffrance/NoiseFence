# NoiseFence profile: local streaming only, 4 concurrent scans, bounded archives.
LocalSocket /run/clamav/clamd.ctl
LocalSocketGroup clamav
LocalSocketMode 660
FixStaleSocket true
User clamav
Foreground true
PidFile /run/clamav/clamd.pid
DatabaseDirectory /var/lib/clamav
OfficialDatabaseOnly true
TemporaryDirectory /tmp
LogSyslog true
LogTime true
LogClean false
ExtendedDetectionInfo false
MaxThreads 4
MaxQueue 8
MaxConnectionQueueLength 16
CommandReadTimeout 5
ReadTimeout 5
SendBufTimeout 500
StreamMaxLength 25M
MaxFileSize 25M
MaxScanSize 100M
MaxScanTime 2000
MaxRecursion 16
MaxFiles 500
AlertExceedsMax true
AlertEncrypted true
HeuristicAlerts true
ScanMail true
ScanArchive true
ScanHTML true
ScanOLE2 true
ScanPDF true
DetectPUA false
Bytecode true
BytecodeSecurity TrustSigned
ConcurrentDatabaseReload false
SelfCheck 600
