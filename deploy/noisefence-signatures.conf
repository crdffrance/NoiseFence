# Advisory scanner; no official databases are installed in this directory.
LocalSocket /run/noisefence-signatures/clamd.ctl
LocalSocketGroup clamav
LocalSocketMode 660
FixStaleSocket true
User clamav
Foreground true
PidFile /run/noisefence-signatures/clamd.pid
DatabaseDirectory /var/lib/noisefence-signatures
OfficialDatabaseOnly false
TemporaryDirectory /tmp
LogSyslog true
LogTime true
LogClean false
ExtendedDetectionInfo false
MaxThreads 2
MaxQueue 6
MaxConnectionQueueLength 8
CommandReadTimeout 5
ReadTimeout 5
SendBufTimeout 500
StreamMaxLength 25M
MaxFileSize 25M
MaxScanSize 100M
MaxScanTime 2000
MaxRecursion 16
MaxFiles 500
AlertExceedsMax true
AlertEncrypted true
HeuristicAlerts true
ScanMail true
ScanArchive true
ScanHTML true
ScanOLE2 true
ScanPDF true
DetectPUA false
Bytecode false
ConcurrentDatabaseReload false
SelfCheck 600
