# Linux only. Host networking preserves the SMTP client IP for SPF and IP reputation.
# The operator supplies config, certificates and a reverse proxy. See installation.md.
services:
  noisefence:
    build:
      context: ..
      dockerfile: Dockerfile
    image: noisefence:local
    network_mode: host
    restart: unless-stopped
    init: true
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    pids_limit: 512
    mem_limit: 4g
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=128m,mode=1777
    volumes:
      - ${NOISEFENCE_CONFIG_DIR:?Set the absolute configuration directory}:/etc/noisefence:ro
      - ${NOISEFENCE_DATA_DIR:?Set the absolute data directory}:/var/lib/noisefence
    stop_grace_period: 60s
