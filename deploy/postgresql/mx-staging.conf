# Temporary PostgreSQL hosting alongside a mail gateway with 8 GiB RAM.
# Installation settings only; do not expose these through the message-policy API.
# No TCP listener: local Unix sockets and peer authentication only.
listen_addresses = ''
max_connections = 20
shared_buffers = '128MB'
effective_cache_size = '512MB'
work_mem = '4MB'
maintenance_work_mem = '64MB'
autovacuum_work_mem = '32MB'
max_worker_processes = 4
max_parallel_workers = 2
max_parallel_workers_per_gather = 1
max_parallel_maintenance_workers = 1
min_wal_size = '80MB'
max_wal_size = '512MB'
fsync = on
synchronous_commit = on
full_page_writes = on
wal_compression = on
password_encryption = 'scram-sha-256'
jit = off
# Keep SQL parameters and failing statement contents out of server logs.
log_statement = 'none'
log_min_duration_statement = -1
log_min_error_statement = 'panic'
log_parameter_max_length_on_error = 0
