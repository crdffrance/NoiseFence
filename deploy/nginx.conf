# Replace mx.example.org and certificate paths with the verified SMTP hostname.
limit_req_zone $binary_remote_addr zone=noisefence_login:10m rate=5r/m;
server {
    listen 80;
    listen [::]:80;
    server_name mx.example.org;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://mx.example.org$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mx.example.org;
    ssl_certificate /etc/letsencrypt/live/mx.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mx.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:NoiseFenceTLS:10m;
    ssl_session_tickets off;
    server_tokens off;
    client_max_body_size 32k;
    client_body_timeout 10s;
    add_header Strict-Transport-Security "max-age=86400" always;
    # Authenticated multi-MX exchange: bounded metadata, streamed model downloads.
    location ^~ /api/v1/cluster/v1/ {
        client_max_body_size 4m;
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 190s;
        proxy_buffering off;
    }
    location = /api/v1/login {
        limit_req zone=noisefence_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
