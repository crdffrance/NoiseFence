[package]
name = "noisefence"
version = "0.4.15"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
description = "NoiseFence: a durable SMTP antispam gateway with a local engine and private console"
repository = "https://github.com/crdffrance/NoiseFence"
homepage = "https://github.com/crdffrance/NoiseFence"
readme = "README.md"
publish = false

[features]
semantic = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers"]

[dependencies]
anyhow = "1"
argon2 = "0.5"
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
idna = "1"
psl = "2.1"
scraper = { version = "0.27", default-features = false }
libc = "0.2"
mail-auth = { version = "0.12.1", default-features = false, features = ["ring", "dns-hickory", "arc"] }
mail-parser = "0.11"
rand = "0.8"
regex = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls-no-provider"] }
rpassword = "7"
rusqlite = { version = "0.37", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
toml = "0.9"
tower-http = { version = "0.6", features = ["fs", "limit", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
webpki-roots = "1"
candle-core = { version = "=0.11.0", default-features = false, optional = true }
candle-nn = { version = "=0.11.0", default-features = false, optional = true }
candle-transformers = { version = "=0.11.0", default-features = false, optional = true }
tokenizers = { version = "=0.22.2", default-features = false, features = ["onig"], optional = true }

[dev-dependencies]
rcgen = "0.14"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[[bin]]
name = "noisefence"
path = "src/main.rs"

[[example]]
name = "semantic_probe"
required-features = ["semantic"]
