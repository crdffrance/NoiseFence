# Local evaluation only. No public port, credentials, API keys or outbound route.
# See docs/installation.md before receiving real mail.
hostname = "gateway.example.test"
data_dir = "/var/lib/noisefence"

[smtp]
listen = "127.0.0.1:2525"
minimum_free_bytes = 10485760

[web]
listen = "127.0.0.1:18080"
public_origin = "http://127.0.0.1:18080"
static_dir = "/opt/noisefence/web"
secure_cookies = false

[filter]
mode = "observe"
threshold = 95.0
authentication = false
require_corroboration = true

[native_filter]
mode = "observe"

[relay]
# Intentional local dead end. Use an isolated test sink to exercise delivery.
# Public production relays require certificate-verified TLS.
require_tls = true
port = 2526
postmaster = "postmaster@example.test"

[[domains]]
name = "example.test"
next_hops = ["127.0.0.1"]
recipients = ["alice@example.test", "bob@example.test"]
[domains.aliases]
"billing@example.test" = "alice@example.test"

[protection]
# Installed for Web configuration; paid lookups still require an authorized key.
[mailing]
