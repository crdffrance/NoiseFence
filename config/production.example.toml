# Template only. Confirm DNS names, certificates, recipients and Linux paths.
hostname = "mx.example.org"
data_dir = "/var/lib/noisefence"

[smtp]
listen = "0.0.0.0:25"
tls_cert = "/etc/noisefence/tls/current/fullchain.pem"
tls_key = "/etc/noisefence/tls/current/key.pem"
max_message_bytes = 26214400
max_connections = 128
max_connections_per_ip = 8
# DATA + analysis + durable enqueue. Start at 1 with one semantic/OCR worker;
# raise only after measuring complete analyses, memory and retryable responses.
max_processing = 1
max_recipients = 100
command_timeout_seconds = 300
minimum_free_bytes = 1073741824

[web]
listen = "127.0.0.1:8080"
public_origin = "https://noisefence.example.org"
static_dir = "/opt/noisefence/web"
secure_cookies = true

# Optional: delivery actions, independent of classification. In observation, all deliver.
# [actions]
# spam = "quarantine"
# publicity = "deliver"
# malware = "quarantine"
# quarantine_days = 14
# Switch filter.mode to "enforce" to apply them; tagging still requires Proton/ARC.

[filter]
mode = "observe"
threshold = 95.0
# Score alone does not decide Spam; see docs/confirmation.md for recall tradeoffs.
require_corroboration = true
authentication = true
max_analysis_bytes = 2097152
# spamhaus_key_env = "SPAMHAUS_DQS_KEY"
# model = "/var/lib/noisefence/models/active.json"
# arc_key = "/etc/noisefence/arc/rsa.pem" # RSA PKCS#1 PEM
# arc_domain = "example.org"
# arc_selector = "gateway2026"
# proton_report = "/etc/noisefence/proton-validation.json"

# Optional isolated local OCR/QR service; install deploy/install-vision.sh first.
# See docs/vision.md. Incomplete checks prevent subject tagging.
# [vision]
# socket = "/run/noisefence-vision/worker.sock"
# timeout_ms = 3000
# max_parallel = 1
# contribute_to_score = false

# Optional local semantic combination; requires a binary built with --features semantic.
# Use the matching calibrated filter.model and an independently validated combination.
# See research/README.md for native trials and resource controls.
# [filter.semantic]
# encoder_dir = "/var/lib/noisefence/models/encoder"
# combination = "/var/lib/noisefence/models/native-combination.json"
# max_parallel = 1
# timeout_ms = 500

# Optional learned fusion; absent by default. See research/fusion.md.
# The model must match the exact loaded detector artifacts. Observe first.
# [fusion]
# model = "/var/lib/noisefence/models/fusion.json"
# mode = "observe"
# Decision mode also requires audited quality and full-pipeline latency evidence.
# It does not bypass the independent Proton compatibility gate.
# validation_report = "/etc/noisefence/fusion-validation.json"

# Optional SMTP/DNS coherence checks; no message content or SMTP rejection.
# Start in observation and measure before applying the experimental weights.
# See docs/smtp-policy.md. An absent table disables all of these lookups.
# [smtp_policy]
# contribute_to_score = false
# timeout_ms = 800
# max_parallel = 8
# cache_entries = 4096
# cache_ttl_seconds = 300

# Optional local scanner; see docs/antivirus.md before enabling it.
# [antivirus]
# socket = "/run/clamav/clamd.ctl"
# timeout_ms = 3000
# max_bytes = 26214400
# trusted_unofficial_prefixes = []

# Separate advisory scanner: prevents a spam match from hiding a malware match.
# [signatures]
# socket = "/run/noisefence-signatures/clamd.ctl"
# timeout_ms = 3000
# max_bytes = 26214400

# Optional paid external text analysis; disabled until explicitly configured.
# [llm]
# project_id = "00000000-0000-0000-0000-000000000000" # Replace with isolated project
# model = "mistral-small-3.2-24b-instruct-2506"
# api_key_env = "NOISEFENCE_SCALEWAY_API_KEY"
# monthly_budget_micro_eur = 0 # 0 disables calls; 20000000 = EUR 20
# input_micro_eur_per_million = 150000 # Recheck provider prices before enabling
# output_micro_eur_per_million = 350000
# pricing_checked_at = 0 # Unix UTC timestamp; calls stop after 30 days
# timeout_ms = 2500
# max_text_bytes = 12000
# max_output_tokens = 256
# score_low = 20.0
# score_high = 98.0
# max_parallel = 2

[relay]
workers = 8
require_tls = true
port = 25
max_queue_age_seconds = 432000
postmaster = "postmaster@example.org"

[[domains]]
name = "example.org"
next_hops = ["mail.protonmail.ch", "mailsec.protonmail.ch"]
# Default: accept only the listed mailboxes and explicit aliases.
# Set true to relay every valid address in this exact domain to itself at Proton.
# The destination must exist at Proton, or be covered by its catch-all.
accept_all_recipients = false
# Optional when accept_all_recipients = true; preserves explicit canonical spelling.
recipients = []
[domains.aliases]
# "alias@example.org" = "canonical@example.org"

# Optional pilot domain, after adding canonical@example.org to recipients above.
# Its DNS must point to this gateway. Only the named alias is accepted.
# The destination mailbox supplies its explicit Proton route and console grants.
# [[domains]]
# name = "pilot.example.org"
# recipients = []
# [domains.aliases]
# "test@pilot.example.org" = "canonical@example.org"

# Optional additional detectors, observation only. Provider keys stay on the server.
[protection]
timeout_ms = 1200
max_parallel = 2
crdf_per_minute = 2
crdf_per_day = 200
virustotal_per_minute = 4
virustotal_per_day = 500

# PUB is independent of the spam score; observe never changes delivered subjects.
# After installation, enable this module in the saved console settings if needed.
[mailing]
# proton_report = "/etc/noisefence/proton-validation-pub.json"

[mailing.policy]
include_newsletters = true
tag_subject = true
