name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Require a tag-scoped execution
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: test "$REF_TYPE" = tag
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Verify reviewed release source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          python3 scripts/check_release_source.py --tag "$RELEASE_TAG" --default-branch "$DEFAULT_BRANCH" --commit "$EXPECTED_COMMIT"
          python3 scripts/version.py --check --tag "$RELEASE_TAG"
  validate:
    needs: preflight
    uses: ./.github/workflows/check.yml
    with:
      source_ref: ${{ github.sha }}
  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-amd64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          # Release artifacts must not consume a shared Actions dependency cache.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: '1.98.0'
      - name: Check version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/version.py --check --tag "$RELEASE_TAG"
      - name: Build static console
        working-directory: web
        run: npm ci && npx tsc --noEmit && npm run lint && npm run build
      - name: Build and test Linux binary on Bookworm
        run: |
          build_image=rust@sha256:82150a52ec202c1b14d7817e14516c392bb7f5cfebd88f1ed531cb37ebd39922
          for pull_attempt in 1 2 3; do
            if docker pull "$build_image"; then break; fi
            if [ "$pull_attempt" -eq 3 ]; then exit 1; fi
            sleep "$((pull_attempt * 5))"
          done
          # Private to this job; no restored/saved/shared dependency cache.
          mkdir -p "$RUNNER_TEMP/noisefence-release-cargo"
          docker run --pull=never --rm --add-host=localhost.:127.0.0.1 \
            --env CARGO_HOME=/cargo --volume "$RUNNER_TEMP/noisefence-release-cargo:/cargo" \
            --env RUST_TEST_THREADS=1 --volume "$PWD:/workspace" --workdir /workspace \
            "$build_image" \
            sh -c 'getent hosts localhost. && cargo test --release --locked --features semantic && cargo build --release --locked --features semantic'
      - run: python3 scripts/collect_licenses.py
      - name: Assemble release
        env:
          PLATFORM: ${{ matrix.platform }}
        run: python3 scripts/package_release.py --binary target/release/noisefence --platform "$PLATFORM"
      - name: Generate an isolated baseline fixture
        run: |
          baseline=$(python3 scripts/release_rehearsal.py baseline-version)
          mkdir -p var/release-rehearsal
          docker run --pull=never --rm --network none \
            --env CARGO_HOME=/cargo --volume "$RUNNER_TEMP/noisefence-release-cargo:/cargo" \
            --volume "$PWD:/workspace" --workdir /workspace \
            --env NOISEFENCE_REHEARSAL_OUTPUT=/workspace/var/release-rehearsal/fixture \
            --env NOISEFENCE_REHEARSAL_BASE_BUILD="$baseline" \
            --env NOISEFENCE_REHEARSAL_SHARED_LOOPBACK=1 \
            rust@sha256:82150a52ec202c1b14d7817e14516c392bb7f5cfebd88f1ed531cb37ebd39922 \
            cargo test --release --locked --offline --features semantic --test management_rehearsal_fixture -- --ignored
          sudo chown -R "$(id -u):$(id -g)" var/release-rehearsal
      - name: Qualify exact native release archives
        env:
          PLATFORM: ${{ matrix.platform }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 scripts/version.py)
          sh scripts/check_release_lifecycle.sh "$PLATFORM" "release/noisefence-$version-$PLATFORM.tar.gz" var/release-rehearsal/fixture var/release-rehearsal/results
      - name: Retain anonymous native qualification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-release-${{ matrix.platform }}
          path: var/release-rehearsal/results/qualification.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.platform }}
          path: |
            release/noisefence-*.tar.gz
            release/noisefence-*.tar.gz.sha256
  publish:
    needs: [preflight, validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >-
            github.com:443
            api.github.com:443
            uploads.github.com:443
            codeload.github.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            tuf-repo.github.com:443
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          pattern: linux-*
          merge-multiple: true
      - name: Prepare version-specific release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release_notes.py --tag "$RELEASE_TAG" --output release/NOTES.md
      - name: Validate archives before attestation
        env:
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/publish_release.py --tag "$RELEASE_TAG" --directory release --verify-only
      - name: Attest validated release archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/noisefence-*.tar.gz
          create-storage-record: false
      - name: Verify assets and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/publish_release.py --tag "$RELEASE_TAG" --directory release
