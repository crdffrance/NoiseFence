name: checks
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: noisefence_test
          POSTGRES_PASSWORD: synthetic-ci-only-password
        ports:
          - 15432:5432
        options: >-
          --memory=512m --cpus=1
          --health-cmd="pg_isready -U postgres -d noisefence_test"
          --health-interval=5s --health-timeout=3s --health-retries=10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: '1.98.0'
      - name: Exercise central persistence with synthetic accounts and messages
        env:
          NOISEFENCE_TEST_PG_PASSWORD_FILE: ${{ runner.temp }}/noisefence-test-pg-password
          NOISEFENCE_TEST_PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          umask 077
          printf '%s' 'synthetic-ci-only-password' > "$NOISEFENCE_TEST_PG_PASSWORD_FILE"
          trap 'rm -f "$NOISEFENCE_TEST_PG_PASSWORD_FILE"' EXIT
          cargo test --locked --test central_postgres --test central_console --test central_search --test central_logs --test central_commands --test central_policies --test central_transport --test central_quality --test central_adaptive --test central_research --test central_learning --test central_research_worker --test central_runtime_history --test central_reliability --test central_catalog --test central_preview --test central_retention --test central_operator --test central_import --test central_import_quality --test central_import_delivery_ids --test central_import_policy --test central_binding --test central_import_spool --test central_staged_import --test central_activation --test central_restore --test central_recovery --test central_recovery_policy --test central_recovery_prepare --test central_replay --test central_transport_binding --test central_offline_cli --test import_session -- --ignored
  container:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate local Compose configuration
        run: docker compose config --quiet
      - name: Build the non-root release container
        run: docker build --tag noisefence:ci .
      - name: Check bootstrap, English console, SMTP and persistence
        run: python3 tests/container_smoke.py --image noisefence:ci
      - name: Exercise the real Rspamd comparison profile without external network access
        run: python3 tests/rspamd_smoke.py
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: research/requirements.txt
      - run: python3 -m pip install -r research/requirements.txt
      - run: python3 -m unittest discover -s tests_python -v
  deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install -r research/requirements.txt
      - run: python3 -m unittest discover -s tests_python -v
      - name: Verify v1, v2 and v3 metadata limits through Nginx and Caddy
        run: python3 tests/proxy_smoke.py
      - run: sudo python3 tests/systemd_learning.py
      - run: sudo python3 tests/systemd_network.py
      - name: Exercise isolated local OCR, QR and scanned PDF decoding
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-fra tesseract-ocr-eng zbar-tools python3-pil poppler-utils qrencode fonts-dejavu-core
          /usr/bin/python3 tests/vision_worker.py
          sudo /usr/bin/python3 tests/systemd_vision.py
  rust:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            features: ''
            profile: ''
          - runner: ubuntu-latest
            features: '--features semantic'
            profile: ''
          - runner: ubuntu-24.04-arm
            features: '--features semantic'
            profile: '--release'
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: '1.98.0'
          components: rustfmt, clippy
      - run: python3 scripts/version.py --check
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets ${{ matrix.profile }} ${{ matrix.features }} -- -D warnings
      - run: cargo test --locked ${{ matrix.profile }} ${{ matrix.features }}
      - name: Verify full-processing measurement controls
        run: |
          cargo build --locked ${{ matrix.profile }} ${{ matrix.features }} --example pipeline_probe
          profile_dir=debug
          if [ "${{ matrix.profile }}" = "--release" ]; then profile_dir=release; fi
          python3 tests/pipeline_probe.py "target/$profile_dir/examples/pipeline_probe"
      - run: cargo build --release --locked ${{ matrix.features }}
      - name: Verify concurrent SMTP, durable delivery and unchanged bodies
        run: |
          python3 scripts/smtp_load.py --binary target/release/noisefence --output-dir var/smtp-load-small --messages 32 --concurrency 8 --processing 4
          python3 scripts/smtp_load.py --binary target/release/noisefence --output-dir var/smtp-load-pub --messages 32 --concurrency 8 --processing 4 --mailing
          python3 scripts/smtp_load.py --binary target/release/noisefence --output-dir var/smtp-load-large --messages 8 --concurrency 2 --message-bytes 1048576 --processing 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: matrix.runner == 'ubuntu-latest' && matrix.features != ''
        with:
          python-version: '3.11'
      - name: Check feedback export and training against native predictions
        if: matrix.runner == 'ubuntu-latest' && matrix.features != ''
        env:
          OPENBLAS_NUM_THREADS: '2'
          OMP_NUM_THREADS: '2'
        run: |
          python3 -m pip install -r research/requirements.txt
          cargo build --locked --features semantic --example feedback_probe
          python3 research/verify_feedback.py var/feedback-parity --binary target/release/noisefence
          NOISEFENCE_FEEDBACK_PROBE=target/debug/examples/feedback_probe python3 -m unittest discover -s tests_python -p test_feedback_adaptation.py -v
      - name: Check learned fusion against native observations and predictions
        if: matrix.runner == 'ubuntu-latest' && matrix.features != ''
        env:
          OPENBLAS_NUM_THREADS: '2'
          OMP_NUM_THREADS: '2'
        run: |
          cargo build --locked --features semantic --example fusion_fixture
          python3 research/verify_fusion.py var/fusion-parity --binary target/release/noisefence
      - name: Check joint risk and six mail kinds against native shadow predictions
        if: matrix.runner == 'ubuntu-latest' && matrix.features != ''
        env:
          OPENBLAS_NUM_THREADS: '2'
          OMP_NUM_THREADS: '2'
          NOISEFENCE_BINARY: target/release/noisefence
        run: |
          python3 -m unittest discover -s tests_python -p test_quality.py -v
          python3 -m unittest discover -s tests_python -p test_quality_worker.py -v
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm audit --audit-level=high
