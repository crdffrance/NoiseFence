name: checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: research/requirements.txt
      - run: python3 -m pip install -r research/requirements.txt
      - run: python3 -m unittest discover -s tests_python -v
  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests_python -v
  rust:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            features: ''
            profile: ''
          - runner: ubuntu-latest
            features: '--features semantic'
            profile: ''
          - runner: ubuntu-24.04-arm
            features: '--features semantic'
            profile: '--release'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.0'
          components: rustfmt, clippy
      - run: python3 scripts/version.py --check
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets ${{ matrix.profile }} ${{ matrix.features }} -- -D warnings
      - run: cargo test --locked ${{ matrix.profile }} ${{ matrix.features }}
      - run: cargo build --release --locked ${{ matrix.features }}
      - uses: actions/setup-python@v5
        if: matrix.runner == 'ubuntu-latest' && matrix.features != ''
        with:
          python-version: '3.11'
      - name: Check feedback export and training against native predictions
        if: matrix.runner == 'ubuntu-latest' && matrix.features != ''
        env:
          OPENBLAS_NUM_THREADS: '2'
          OMP_NUM_THREADS: '2'
        run: |
          python3 -m pip install -r research/requirements.txt
          cargo build --locked --features semantic --example feedback_probe
          python3 research/verify_feedback.py var/feedback-parity --binary target/release/noisefence
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm audit --audit-level=high
