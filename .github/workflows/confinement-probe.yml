name: confinement socket probe
on:
  push:
    paths:
      - 'deploy/hardening/**'
      - 'deploy/noisefence.service'
      - 'tests/confinement_socket_probe.py'
      - 'tests/confined_paired_release.py'
      - 'tests/fixtures/postgres_socket_probe.rs'
      - 'scripts/rehearsal_diagnostics.py'
      - '.github/workflows/confinement-probe.yml'
  pull_request:
    paths:
      - 'deploy/hardening/**'
      - 'deploy/noisefence.service'
      - 'tests/confinement_socket_probe.py'
      - 'tests/confined_paired_release.py'
      - 'tests/fixtures/postgres_socket_probe.rs'
      - 'scripts/rehearsal_diagnostics.py'
      - '.github/workflows/confinement-probe.yml'
permissions:
  contents: read
concurrency:
  group: confinement-socket-${{ github.ref }}
  cancel-in-progress: true
jobs:
  postgres-boundary:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: '1.98.0'
      - name: Prepare the disposable PostgreSQL image and fixed query probe
        run: |
          mkdir -p var/confinement-socket
          rustc --edition=2024 --test tests/fixtures/postgres_socket_probe.rs -o var/confinement-socket/probe-unit
          var/confinement-socket/probe-unit
          rustc --edition=2024 tests/fixtures/postgres_socket_probe.rs -o var/confinement-socket/probe
          docker build --file tests/fixtures/paired.Dockerfile --tag nf-confinement-socket .
      - name: Compare direct and systemd queries with and without AppArmor
        run: python3 tests/confinement_socket_probe.py --binary var/confinement-socket/probe --image nf-confinement-socket --output var/confinement-socket/result
      - name: Retain anonymous diagnostic result only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: confinement-socket-result-${{ matrix.runner }}
          path: var/confinement-socket/result/probe.json
          if-no-files-found: ignore
          retention-days: 14
